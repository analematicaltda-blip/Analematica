<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Metallic Blue Gradient -->
    <linearGradient id="metalBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- Light Blue Glow Gradient -->
    <linearGradient id="lightBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="metallicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Orbit / Precision Ring -->
  <circle cx="50" cy="50" r="45" fill="#0b132b" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 2" opacity="0.6"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#1d4ed8" stroke-width="1.2" opacity="0.4"/>

  <!-- The Analemma Curve (Figure-8 loop tracing the sun's position across the year) -->
  <path d="M 50 18 C 68 28, 68 44, 50 54 C 30 64, 28 82, 50 82 C 72 82, 70 64, 50 54 C 32 44, 32 28, 50 18 Z"
        fill="none"
        stroke="url(#lightBlueGrad)"
        stroke-width="3"
        stroke-linecap="round"
        filter="url(#metallicGlow)" />

  <!-- Solar Nodes / Precision Coordinate Points -->
  <circle cx="50" cy="18" r="3.2" fill="#7dd3fc" stroke="#1e3a8a" stroke-width="1.5" />
  <circle cx="50" cy="54" r="2.8" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="50" cy="82" r="3.2" fill="#7dd3fc" stroke="#1e3a8a" stroke-width="1.5" />

  <!-- Precision Crosshairs -->
  <line x1="50" y1="6" x2="50" y2="14" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="50" y1="86" x2="50" y2="94" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="6" y1="50" x2="14" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="86" y1="50" x2="94" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
</svg>
