map $request_method $analematica_contact_key { default ""; POST $binary_remote_addr; }
limit_req_zone $analematica_contact_key zone=analematica_contact:1m rate=5r/m;
limit_req_zone $analematica_contact_key zone=analematica_login:1m rate=10r/m;
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /healthz { access_log off; default_type text/plain; return 200 'analematica ready\n'; }
    location = /api/v1/workspace/corporate/login {
        client_max_body_size 8k;
        limit_req zone=analematica_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/v1/workspace/corporate/inquiries {
        client_max_body_size 8k;
        limit_req zone=analematica_contact burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/v1/workspace/corporate/config {
        client_max_body_size 80k;
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/v1/workspace/meta/webhooks/receive {
        access_log off;
        client_max_body_size 1m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    # Consent codes must not pass through the web proxy access log.
    location = /api/v1/workspace/instagram/oauth/callback {
        access_log off;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /api/v1/workspace/ads/meta/oauth/callback {
        access_log off;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /sga { return 302 /sga/; }
    location = /sga/js/config.js {
        default_type application/javascript;
        add_header Cache-Control no-store always;
        return 200 'window.config = { apiBaseUrl: window.location.origin };';
    }
    # A root-scoped SGA worker must never take control of the corporate landing.
    location = /service-worker.js { return 404; }
    location = /sga/service-worker.js { return 404; }
    location = /sga/manifest.json { return 404; }
    location /sga/ {
        proxy_pass http://web/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect ~^(/.*)$ /sga$1;
    }
    location / {
        add_header Cache-Control no-cache always;
        try_files $uri $uri/ =404;
    }
}
