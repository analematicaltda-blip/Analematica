[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sgacd-wallet-offline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cryptography>=44,<51"]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sgacd_wallet_offline = ["production_pending.json"]
