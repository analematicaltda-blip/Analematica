{
  "name": "sgacd-web-local",
  "services": {
    "erp-web": {
      "image": "node:24-bookworm-slim",
      "user": "1000:1000",
      "working_dir": "/srv/project",
      "init": true,
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:mode=1777"
      ],
      "volumes": [
        "./.runtime/erp:/srv/project",
        "./node_modules:/srv/deps/node_modules:ro"
      ],
      "environment": {
        "NEXT_TELEMETRY_DISABLED": "1",
        "NEXT_PUBLIC_API_URL": "/api/v1",
        "NEXT_PUBLIC_ENABLE_MOCKS": "false"
      },
      "command": [
        "node",
        "node_modules/next/dist/bin/next",
        "dev",
        "--webpack",
        "--hostname",
        "0.0.0.0",
        "--port",
        "3000"
      ]
    },
    "turismo-web": {
      "image": "node:24-bookworm-slim",
      "user": "1000:1000",
      "working_dir": "/srv/project",
      "init": true,
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:mode=1777"
      ],
      "volumes": [
        "./.runtime/turismo:/srv/project",
        "./node_modules:/srv/deps/node_modules:ro"
      ],
      "environment": {
        "NEXT_TELEMETRY_DISABLED": "1",
        "NEXT_PUBLIC_API_URL": "/api/v1",
        "NEXT_PUBLIC_ENABLE_MOCKS": "false"
      },
      "command": [
        "node",
        "node_modules/next/dist/bin/next",
        "dev",
        "--webpack",
        "--hostname",
        "0.0.0.0",
        "--port",
        "3000"
      ]
    },
    "web": {
      "image": "nginx:alpine",
      "user": "1000:1000",
      "entrypoint": [
        "nginx"
      ],
      "command": [
        "-g",
        "daemon off;"
      ],
      "init": true,
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:mode=1777",
        "/var/cache/nginx:mode=1777"
      ],
      "volumes": [
        "./.runtime/nginx.conf:/etc/nginx/nginx.conf:ro",
        "./.runtime/sites:/sites:ro",
        "./private:/private:ro"
      ],
      "ports": [
        "127.0.0.1:8100:8440",
        "127.0.0.1:8101:8441",
        "127.0.0.1:8102:8442",
        "127.0.0.1:8103:8443"
      ],
      "depends_on": [
        "erp-web",
        "turismo-web"
      ],
      "networks": [
        "default",
        "backends"
      ]
    }
  },
  "networks": {
    "backends": {
      "external": true,
      "name": "${BACKEND_NETWORK:-sgacd-backends_default}"
    }
  }
}
