    paths: ['BACKEND/INTEGRACIONES/**', 'FRONTEND/SGA-CD-WEB.git/js/commercial-*.js', 'FRONTEND/SGA-CD-WEB.git/css/commercial-crm.css', 'FRONTEND/ANALEMATICA-FRONTEND/js/commercial-*.js', 'FRONTEND/ANALEMATICA-FRONTEND/css/commercial-crm.css', 'FRONTEND/SGA-ERP-TUR-FRONTEND/public/**', 'FRONTEND/**/commercial-offline/**', 'FRONTEND/SGA-TUR-FRONTEND/src/components/shared-ui/**', '.github/workflows/local-operation-audit.yml', 'BACKEND/SGA-CD-BACKEND/app/commercial/**', 'BACKEND/ANALEMATICA-BACKEND/gestion_comercial/**', 'BACKEND/SGA-CD-BACKEND/app/api/v1/api.py', 'DESKTOP/asistencia-sgacd/**', 'FRONTEND/ANALEMATICA-FRONTEND/js/admin.js', 'FRONTEND/ANALEMATICA-FRONTEND/js/accounting-ledger.js', 'FRONTEND/ANALEMATICA-FRONTEND/admin.html', 'BACKEND/SGA-CD-BACKEND/app/services/corporate_ledger.py', 'BACKEND/SGA-CD-BACKEND/app/models/corporate.py', 'BACKEND/SGA-CD-BACKEND/app/api/v1/endpoints/corporate.py', 'BACKEND/SGA-CD-BACKEND/tests/test_corporate_ledger*.py', 'BACKEND/SGA-CD-BACKEND/tools/review_corporate_ledger.py', 'FRONTEND/ANALEMATICA-FRONTEND/js/control.js', 'FRONTEND/ANALEMATICA-FRONTEND/js/content.js', 'FRONTEND/ANALEMATICA-FRONTEND/content.html', 'FRONTEND/ANALEMATICA-FRONTEND/css/content.css', 'FRONTEND/ANALEMATICA-FRONTEND/tests/content.cjs', 'BACKEND/ANALEMATICA-BACKEND/deployment/start.py', 'BACKEND/SGA-CD-BACKEND/app/models/assistance.py', 'BACKEND/SGA-CD-BACKEND/app/api/v1/endpoints/assistance_content.py', 'BACKEND/SGA-CD-BACKEND/app/api/v1/api.py', 'BACKEND/SGA-CD-BACKEND/app/services/assistance/**', 'BACKEND/SGA-CD-BACKEND/app/api/v1/endpoints/assistance_control.py', 'BACKEND/SGA-CD-BACKEND/tests/test_assistance*.py', 'FRONTEND/SGA-ERP-TUR-FRONTEND/gestion-comercial/**', 'FRONTEND/deployment/**', 'FRONTEND/shared/**', 'FRONTEND/SGA-ERP-TUR-FRONTEND/gestion-contable/**', 'BACKEND/WALLET-BACKEND/**', 'ANALISIS/**', 'BACKEND/ANALEMATICA-BACKEND/core_erp/**', 'BACKEND/deployment/**', 'BACKEND/SGA-ERP-TUR-BAKEND/**', 'BACKEND/SGA-TUR-BAKEND/**', 'BACKEND/SGA-CD-BACKEND/app/services/platform/**', 'BACKEND/SGA-CD-BACKEND/app/api/v1/endpoints/platform.py', 'BACKEND/SGA-CD-BACKEND/tests/test_platform.py', 'INTEGRACIONES/plan-maestro/**', 'INTEGRACIONES/turismo-erp/**', '.github/workflows/master-integration.yml']
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'sqlite://'
      SECRET_KEY: 'isolated-ci-test-not-a-deployed-secret'
      PYTHONPATH: BACKEND/SGA-CD-BACKEND
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r BACKEND/deployment/requirements-tourism.txt requests fastapi httpx sqlalchemy pydantic-settings 'python-jose[cryptography]' 'passlib[bcrypt]' email-validator python-multipart
      - run: python -m pip install -r FRONTEND/deployment/requirements-tools.txt
      - run: python -m unittest discover -s FRONTEND/deployment/tests -p test_security.py -v
      - run: python BACKEND/deployment/tests/domain_security_check.py -v
      - run: python BACKEND/deployment/tests/provider_security_check.py -v
      - run: CHECK_SERVICE=erp-tur python BACKEND/deployment/tests/schema_readiness_check.py -v
      - run: CHECK_SERVICE=turismo python BACKEND/deployment/tests/schema_readiness_check.py -v
      - run: python BACKEND/deployment/tests/erp_customer_check.py -v
      - run: python BACKEND/deployment/tests/company_scope_check.py -v
      - run: python BACKEND/deployment/tests/company_identity_check.py -v
      - run: python BACKEND/deployment/tests/accounting_foundation_check.py -v
      - run: python BACKEND/deployment/tests/accounting_posting_check.py -v
      - run: python BACKEND/deployment/tests/accounting_adapter_check.py -v
      - run: python BACKEND/deployment/tests/accounting_delivery_check.py -v
      - run: python BACKEND/deployment/tests/accounting_simulation_check.py -v
      - run: python BACKEND/deployment/tests/accounting_sql_check.py -v
      - run: python BACKEND/deployment/tests/accounting_envelope_check.py -v
      - run: python BACKEND/deployment/tests/accounting_invoice_check.py -v
      - run: python BACKEND/deployment/tests/accounting_invoice_queue_check.py -v
      - run: python BACKEND/deployment/tests/accounting_reservation_source_check.py -v
      - run: python BACKEND/deployment/tests/accounting_query_check.py -v
      - run: python BACKEND/deployment/tests/accounting_query_parser_check.py -v
      - run: python BACKEND/deployment/tests/accounting_reports_check.py -v
      - run: python BACKEND/deployment/tests/accounting_reservation_fiscal_check.py -v
      - run: python BACKEND/deployment/tests/accounting_reservation_recognition_check.py -v
      - run: python -m unittest discover -s BACKEND/SGA-CD-BACKEND/tests -p 'test_corporate_ledger*.py' -v
      - run: python BACKEND/deployment/tests/availability_check.py -v
      - run: python BACKEND/deployment/tests/erp_session_check.py -v
      - run: python BACKEND/deployment/tests/password_recovery_check.py -v
      - run: python BACKEND/deployment/tests/mfa_postgres_check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install local commercial media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm ci --prefix FRONTEND/deployment --include=dev --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: FRONTEND/deployment
      - name: Prepare isolated commercial test runtime
        run: |
          mkdir -p /tmp/sgacd-full-web-deps
          test ! -e /tmp/sgacd-full-web-deps/node_modules
          test ! -L /tmp/sgacd-full-web-deps/node_modules
          ln -s "$PWD/FRONTEND/deployment/node_modules" /tmp/sgacd-full-web-deps/node_modules
          chromium_bin=$(node -e "process.stdout.write(require('./FRONTEND/deployment/node_modules/playwright').chromium.executablePath())")
          test -x "$chromium_bin"
          if [ ! -e /usr/bin/chromium ] && [ ! -L /usr/bin/chromium ]; then
            sudo ln -s "$chromium_bin" /usr/bin/chromium
          fi
      - run: python BACKEND/INTEGRACIONES/operacion/verify_local.py --profile commercial-audit --output "$RUNNER_TEMP/pool08-quality"
      - run: python BACKEND/WALLET-BACKEND/tests/wallet_security_check.py -v
      - run: python BACKEND/WALLET-BACKEND/tests/access_policy_check.py -v
      - run: python BACKEND/WALLET-BACKEND/tests/attestation_security_check.py -v
      - run: python BACKEND/WALLET-BACKEND/tests/device_approval_check.py -v
      - run: python BACKEND/deployment/fresh_local.py --directory "$RUNNER_TEMP/sgacd-fresh-erp" --service erp-tur
      - run: python BACKEND/deployment/tests/fresh_database_check.py --directory "$RUNNER_TEMP/sgacd-fresh-erp" --service erp-tur -v
      - run: python BACKEND/deployment/fresh_local.py --directory "$RUNNER_TEMP/sgacd-fresh-tourism" --service turismo
      - run: python BACKEND/deployment/tests/fresh_database_check.py --directory "$RUNNER_TEMP/sgacd-fresh-tourism" --service turismo -v
      - run: CHECK_SERVICE=erp-tur python BACKEND/deployment/tests/tourism_runtime_check.py -v
      - run: CHECK_SERVICE=turismo python BACKEND/deployment/tests/tourism_runtime_check.py -v
      - run: python -m unittest discover -s BACKEND/SGA-CD-BACKEND/tests -p test_platform.py -v
      - run: python -m unittest discover -s BACKEND/SGA-CD-BACKEND/tests -p 'test_assistance*.py' -v
      - run: python -m unittest discover -s BACKEND/SGA-CD-BACKEND/tests -p test_resources.py -v
      - run: python BACKEND/INTEGRACIONES/turismo-erp/inventory.py --output /tmp/inventario.json
      - run: python -m unittest discover -s BACKEND/deployment/tests -v
      - run: python BACKEND/INTEGRACIONES/seguridad-ia/verify_vendor.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix DESKTOP/asistencia-sgacd --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: DESKTOP/asistencia-sgacd
      - run: PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" node FRONTEND/ANALEMATICA-FRONTEND/tests/platform.cjs
      - run: PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" node FRONTEND/ANALEMATICA-FRONTEND/tests/content.cjs
      - run: npm install --prefix "$RUNNER_TEMP/quotation-ui" --ignore-scripts --no-audit --no-fund esbuild@0.25.11 react@19.2.0 react-dom@19.2.0 typescript@5.9.3 @types/react@19.2.2 @types/react-dom@19.2.2
      - run: QUOTE_GATEWAY=1 QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" QUOTE_PYTHON=python PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" CHROMIUM_PATH=playwright node FRONTEND/deployment/tests/quotation_browser.cjs
      - run: QUOTE_MFA=1 QUOTE_GATEWAY=1 QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" QUOTE_PYTHON=python PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" CHROMIUM_PATH=playwright node FRONTEND/deployment/tests/quotation_browser.cjs
      - run: QUOTE_RECOVERY=1 QUOTE_MFA=1 QUOTE_GATEWAY=1 QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" QUOTE_PYTHON=python PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" CHROMIUM_PATH=playwright node FRONTEND/deployment/tests/quotation_browser.cjs
      - run: QUOTE_RESET=1 QUOTE_MFA=1 QUOTE_GATEWAY=1 QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" QUOTE_PYTHON=python PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" CHROMIUM_PATH=playwright node FRONTEND/deployment/tests/quotation_browser.cjs
      - run: QUOTE_ISSUE=1 QUOTE_MFA=1 QUOTE_GATEWAY=1 QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" QUOTE_PYTHON=python PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" CHROMIUM_PATH=playwright node FRONTEND/deployment/tests/quotation_browser.cjs
      - run: node FRONTEND/deployment/check_sources.cjs --dependencies "$RUNNER_TEMP/quotation-ui/node_modules" --output "$RUNNER_TEMP/web-source-syntax.json"
      - run: QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" CHROMIUM_PATH=playwright node FRONTEND/deployment/tests/switch_browser.cjs
      - run: QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" CHROMIUM_PATH=playwright node FRONTEND/deployment/tests/accounting_browser.cjs
      - run: QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" CHROMIUM_PATH=playwright node FRONTEND/deployment/tests/commercial_queue_browser.cjs
      - run: QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" CHROMIUM_PATH=playwright node FRONTEND/deployment/tests/accounting_query_browser.cjs
      - run: QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" CHROMIUM_PATH=playwright node FRONTEND/deployment/tests/accounting_query_races.cjs
      - run: QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" node FRONTEND/deployment/tests/fiscal_envelope_types.cjs
      - run: QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" node FRONTEND/deployment/tests/commercial_queue_types.cjs
      - run: QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" node FRONTEND/deployment/tests/accounting_query_types.cjs
      - run: QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" node FRONTEND/deployment/tests/reservation_billing_types.cjs
      - run: QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" node FRONTEND/deployment/tests/reservation_recognition_types.cjs
      - run: QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" CHROMIUM_PATH=playwright node FRONTEND/deployment/tests/fiscal_envelope_browser.cjs
      - run: LEDGER_BROWSER=1 QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" QUOTE_PYTHON=python PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" CHROMIUM_PATH=playwright node FRONTEND/deployment/tests/accounting_integration_browser.cjs
      - run: QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" QUOTE_PYTHON=python PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" CHROMIUM_PATH=playwright node FRONTEND/deployment/tests/corporate_ledger_browser.cjs
      - run: QUOTE_ENROLL=1 QUOTE_GATEWAY=1 QUOTE_UI_DEPS="$RUNNER_TEMP/quotation-ui/node_modules" QUOTE_PYTHON=python PLAYWRIGHT_MODULE="$PWD/DESKTOP/asistencia-sgacd/node_modules/playwright" CHROMIUM_PATH=playwright node FRONTEND/deployment/tests/quotation_browser.cjs
      - run: node --test DESKTOP/asistencia-sgacd/tests/*.test.mjs
