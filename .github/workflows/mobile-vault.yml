name: Local document vault
on:
  push:
    paths: ['WALLET-FRONTEND/native_bridge/**', 'WALLET-MOVIL/native/pool-01-cryptography/**', 'WALLET-MOVIL/native/pool-02-biometrics/**', 'WALLET-MOVIL/native/pool-03-integrity/**', 'WALLET-MOVIL/native/pool-04-anti-phishing/**', '.github/workflows/mobile-vault.yml']
  pull_request:
    paths: ['WALLET-FRONTEND/native_bridge/**', 'WALLET-MOVIL/native/pool-01-cryptography/**', 'WALLET-MOVIL/native/pool-02-biometrics/**', 'WALLET-MOVIL/native/pool-03-integrity/**', 'WALLET-MOVIL/native/pool-04-anti-phishing/**', '.github/workflows/mobile-vault.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - run: python WALLET-MOVIL/native/pool-01-cryptography/tests/verify.py --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
      - run: gradle :android:assembleDebug
        working-directory: WALLET-MOVIL/native/pool-01-cryptography
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: WALLET-MOVIL/native/pool-01-cryptography/ios
      - run: xcodebuild -scheme SGAVault -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/sgacd-vault-derived CODE_SIGNING_ALLOWED=NO build
        working-directory: WALLET-MOVIL/native/pool-01-cryptography/ios
  python-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'flet==0.28.3' build
      - run: python WALLET-FRONTEND/native_bridge/sync_native.py
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s WALLET-FRONTEND/native_bridge/tests -v
      - run: python -m build --wheel WALLET-FRONTEND/native_bridge --outdir /tmp/vault-wheel
  flutter-bridge:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: apk
          - os: macos-latest
            target: ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
      - run: python WALLET-FRONTEND/native_bridge/sync_native.py
      - run: flutter pub get
        working-directory: WALLET-FRONTEND/native_bridge/src/flutter/sgacd_vault
      - run: flutter analyze --no-fatal-infos
        working-directory: WALLET-FRONTEND/native_bridge/src/flutter/sgacd_vault
      - run: flutter test
        working-directory: WALLET-FRONTEND/native_bridge/src/flutter/sgacd_vault
      - run: python WALLET-FRONTEND/native_bridge/make_flutter_host.py --directory "$RUNNER_TEMP/vault-host"
      - run: flutter build apk --debug
        if: matrix.target == 'apk'
        working-directory: ${{ runner.temp }}/vault-host
      - run: flutter build ios --simulator --debug
        if: matrix.target == 'ios'
        working-directory: ${{ runner.temp }}/vault-host
