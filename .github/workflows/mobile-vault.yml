name: Local document vault
on:
  push:
    paths: ['pool-01-cryptography/**', 'pool-02-biometrics/**', 'pool-03-integrity/**', 'pool-04-anti-phishing/**', '.github/workflows/mobile-vault.yml']
  pull_request:
    paths: ['pool-01-cryptography/**', 'pool-02-biometrics/**', 'pool-03-integrity/**', 'pool-04-anti-phishing/**', '.github/workflows/mobile-vault.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - run: python pool-01-cryptography/tests/verify.py --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
      - run: gradle :android:assembleDebug
        working-directory: pool-01-cryptography
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: pool-01-cryptography/ios
      - run: xcodebuild -scheme SGAVault -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/sgacd-vault-derived CODE_SIGNING_ALLOWED=NO build
        working-directory: pool-01-cryptography/ios
