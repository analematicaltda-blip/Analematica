name: Device-bound wallet approvals
on:
  push:
    paths: ['pool-04-anti-phishing/**', 'pool-03-integrity/**', 'pool-02-biometrics/**', 'BACKEND/SGA-TUR-BAKEND/apps/wallet/**', 'BACKEND/deployment/tests/device_approval_check.py', '.github/workflows/mobile-biometric.yml']
  pull_request:
    paths: ['pool-04-anti-phishing/**', 'pool-03-integrity/**', 'pool-02-biometrics/**', 'BACKEND/SGA-TUR-BAKEND/apps/wallet/**', 'BACKEND/deployment/tests/device_approval_check.py', '.github/workflows/mobile-biometric.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r BACKEND/deployment/requirements-tourism.txt
      - run: python -m unittest discover -s pool-03-integrity/tests -p test_release.py -v
      - run: python BACKEND/deployment/tests/device_approval_check.py -v
      - run: python pool-04-anti-phishing/tests/verify.py --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
      - run: sudo --preserve-env=JAVA_HOME,PATH "$(which python)" pool-04-anti-phishing/tests/local_tls.py
      - run: python pool-03-integrity/tests/verify.py --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
      - run: python pool-02-biometrics/tests/verify.py --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :android:assembleDebug
        working-directory: pool-02-biometrics
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s pool-03-integrity/tests -p test_release.py -v
      - run: swift test --package-path pool-04-anti-phishing/ios/SGAProtection
      - run: swift test --package-path pool-03-integrity/ios/SGAIntegrity
      - run: swift test
        working-directory: pool-02-biometrics/ios
      - run: xcodebuild -scheme SGAApproval -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/sgacd-approval-derived CODE_SIGNING_ALLOWED=NO build
        working-directory: pool-02-biometrics/ios
