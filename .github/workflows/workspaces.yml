name: Role workspaces
on:
  push:
    paths: ['SGA-CD-BACKEND/app/**', 'tests/workspace/**', 'scripts/integrate_workspace.py', '.github/workflows/workspaces.yml']
  pull_request:
    paths: ['SGA-CD-BACKEND/app/**', 'tests/workspace/**', 'scripts/integrate_workspace.py', '.github/workflows/workspaces.yml']
permissions:
  contents: read
jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi httpx sqlalchemy 'pydantic[email]' pydantic-settings 'python-jose[cryptography]' passlib bcrypt requests python-multipart
      - run: python -m unittest discover -s tests/workspace -v
      - run: python -m unittest discover -s SGA-CD-BACKEND/tests -p test_institutional_panels.py -v
