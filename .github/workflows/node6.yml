name: Node 6 tests
on:
  push:
    paths:
      - 'infra/node6/**'
      - 'scripts/*node6*'
      - 'tests/node6/**'
      - '.github/workflows/node6.yml'
  pull_request:
    paths:
      - 'infra/node6/**'
      - 'scripts/*node6*'
      - 'tests/node6/**'
permissions:
  contents: read
jobs:
  node6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r infra/node6/requirements.txt httpx
      - run: python tests/node6/test_node6.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          NODE6_OUTPUT: ${{ runner.temp }}/node6-import
      - run: python tests/node6/test_setup.py
