name: Local backend deployment
on:
  push:
    paths: ['BACKEND/deployment/**', 'BACKEND/ANALEMATICA-BACKEND/deployment/api.py', '.github/workflows/backends-local.yml']
  pull_request:
    paths: ['BACKEND/deployment/**', 'BACKEND/ANALEMATICA-BACKEND/deployment/api.py', '.github/workflows/backends-local.yml']
permissions:
  contents: read
jobs:
  configuration-and-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r BACKEND/deployment/requirements-tools.txt -r BACKEND/deployment/requirements-analematica.txt
      - run: python -m unittest discover -s BACKEND/deployment/tests -v
      - run: python BACKEND/deployment/init_local.py
      - run: docker compose -f BACKEND/deployment/compose.yaml config --quiet
