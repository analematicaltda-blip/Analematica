name: SSO broker tests
on:
  push:
    paths:
      - 'BACKEND/SGA-CD-BACKEND/app/services/sso_service.py'
      - 'BACKEND/SGA-CD-BACKEND/app/api/v1/endpoints/sso.py'
      - 'BACKEND/tests/sso/**'
      - '.github/workflows/sso.yml'
  pull_request:
    paths:
      - 'BACKEND/SGA-CD-BACKEND/app/services/sso_service.py'
      - 'BACKEND/SGA-CD-BACKEND/app/api/v1/endpoints/sso.py'
      - 'BACKEND/tests/sso/**'
permissions:
  contents: read
jobs:
  broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests 'python-jose[cryptography]'
      - run: python BACKEND/tests/sso/test_broker.py
