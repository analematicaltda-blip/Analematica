name: Frontend regression
on:
  push:
    paths:
      - 'FRONTEND/SGA-CD-WEB.git/**'
      - 'BACKEND/tools/**'
      - 'DESKTOP/tools/flet_preview/web-manifest.json'
      - 'FRONTEND/tests/**'
      - '.github/workflows/frontend-regression.yml'
  pull_request:
    paths:
      - 'FRONTEND/SGA-CD-WEB.git/**'
      - 'BACKEND/tools/**'
      - 'FRONTEND/tests/**'
      - '.github/workflows/frontend-regression.yml'
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/sgacd-browser" --no-package-lock playwright@1.60.0 gsap@3.12.5
          "$RUNNER_TEMP/sgacd-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test landing and offline updates
        shell: bash
        run: |
          set -euo pipefail
          python3 FRONTEND/tests/publisher.py
          mkdir -p "$RUNNER_TEMP/sgacd-demo"
          cp -R FRONTEND/SGA-CD-WEB.git "$RUNNER_TEMP/sgacd-demo/web"
          python3 FRONTEND/tools/update_demo_web.py --demo-dir "$RUNNER_TEMP/sgacd-demo"
          python3 -m http.server 18090 --bind 127.0.0.1 --directory "$RUNNER_TEMP/sgacd-demo/web" > "$RUNNER_TEMP/sgacd-web.log" 2>&1 &
          web_server_pid=$!
          trap 'kill "$web_server_pid"' EXIT
          node FRONTEND/tests/service-worker.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/sgacd-browser/node_modules/playwright" node FRONTEND/tests/landing.cjs
          SGA_WEB_URL=http://127.0.0.1:18090 PLAYWRIGHT_MODULE="$RUNNER_TEMP/sgacd-browser/node_modules/playwright" node FRONTEND/tests/landing-resilience.cjs
          SGA_WEB_URL=http://127.0.0.1:18090 PLAYWRIGHT_MODULE="$RUNNER_TEMP/sgacd-browser/node_modules/playwright" node FRONTEND/tests/landing-order.cjs
          SGA_WEB_URL=http://127.0.0.1:18090 PLAYWRIGHT_MODULE="$RUNNER_TEMP/sgacd-browser/node_modules/playwright" GSAP_DIST="$RUNNER_TEMP/sgacd-browser/node_modules/gsap/dist" node FRONTEND/tests/monitor-animations.cjs
          SGA_WEB_URL=http://127.0.0.1:18090 PLAYWRIGHT_MODULE="$RUNNER_TEMP/sgacd-browser/node_modules/playwright" node FRONTEND/tests/oauth.cjs
          SGA_WEB_URL=http://127.0.0.1:18090 PLAYWRIGHT_MODULE="$RUNNER_TEMP/sgacd-browser/node_modules/playwright" GSAP_DIST="$RUNNER_TEMP/sgacd-browser/node_modules/gsap/dist" node FRONTEND/tests/workspace.cjs
          SGA_WEB_URL=http://127.0.0.1:18090 PLAYWRIGHT_MODULE="$RUNNER_TEMP/sgacd-browser/node_modules/playwright" GSAP_DIST="$RUNNER_TEMP/sgacd-browser/node_modules/gsap/dist" node FRONTEND/tests/campaigns.cjs
