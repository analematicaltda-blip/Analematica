name: Flet node setup
on:
  push:
    paths:
      - 'MOVILES/**'
      - 'DESKTOP/**'
      - 'DESKTOP/tools/*flet*'
      - 'DESKTOP/tools/flet_preview/**'
      - 'DESKTOP/tests/flet/**'
      - '.github/workflows/flet-nodes.yml'
  pull_request:
    paths:
      - 'MOVILES/**'
      - 'DESKTOP/**'
      - 'DESKTOP/tools/*flet*'
      - 'DESKTOP/tools/flet_preview/**'
      - 'DESKTOP/tests/flet/**'
      - '.github/workflows/flet-nodes.yml'
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 DESKTOP/tests/flet/setup_nodes.py
      - run: python3 -m py_compile DESKTOP/tools/start_flet_nodes.py DESKTOP/tools/setup_flet_previews.py DESKTOP/tools/flet_preview/check_session.py
