name: Flet node setup
on:
  push:
    paths:
      - 'scripts/*flet*'
      - 'scripts/flet_preview/**'
      - 'tests/flet/**'
      - '.github/workflows/flet-nodes.yml'
  pull_request:
    paths:
      - 'scripts/*flet*'
      - 'scripts/flet_preview/**'
      - 'tests/flet/**'
      - '.github/workflows/flet-nodes.yml'
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/flet/setup_nodes.py
      - run: python3 -m py_compile scripts/start_flet_nodes.py scripts/setup_flet_previews.py scripts/flet_preview/check_session.py
