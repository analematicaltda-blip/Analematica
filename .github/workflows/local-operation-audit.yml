name: Local operation evidence
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Isolated profile to verify (never deploys)
        type: choice
        default: core
        options: [core, accounting, backup, fresh, browser, devices, postgres]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROFILE: ${{ inputs.profile }}
      PYTHONDONTWRITEBYTECODE: '1'
      DATABASE_URL: 'sqlite://'
      SECRET_KEY: 'isolated-operation-ci-not-a-deployed-secret'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r BACKEND/deployment/requirements-tourism.txt -r FRONTEND/deployment/requirements-tools.txt requests fastapi httpx sqlalchemy pydantic-settings 'python-jose[cryptography]' 'passlib[bcrypt]' email-validator python-multipart
      - uses: actions/setup-node@v4
        if: inputs.profile == 'browser' || inputs.profile == 'devices'
        with:
          node-version: '24'
      - run: npm ci --prefix DESKTOP/asistencia-sgacd --ignore-scripts
        if: inputs.profile == 'browser' || inputs.profile == 'devices'
      - run: npx playwright install --with-deps chromium
        working-directory: DESKTOP/asistencia-sgacd
        if: inputs.profile == 'browser' || inputs.profile == 'devices'
      - name: Run selected isolated checks
        run: python INTEGRACIONES/operacion/verify_local.py --profile "$PROFILE" --output "$RUNNER_TEMP/operation-evidence"
      - name: Preserve summary only (raw logs remain private)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operation-summary-${{ inputs.profile }}
          path: |
            ${{ runner.temp }}/operation-evidence/report.json
            ${{ runner.temp }}/operation-evidence/source-manifest.json
            ${{ runner.temp }}/operation-evidence/checksums.json
          if-no-files-found: warn
          retention-days: 7
