[project]
name = "sgacd-wallet-mobile"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["flet==0.28.3", "sgacd-wallet-ui==0.1.0", "sgacd-wallet-offline==0.1.0", "sgacd-vault==0.4.0"]
[tool.flet]
org = "co.analematica"
product = "Billetera Analematica"
[tool.flet.dev_packages]
sgacd-wallet-ui = "../WALLET-FRONTEND"
sgacd-wallet-offline = "../WALLET-BACKEND/offline"
sgacd-vault = "../WALLET-FRONTEND/native_bridge"
[tool.flet.android]
min_sdk_version = 31
target_sdk_version = 35
[tool.flet.ios.info]
NSFaceIDUsageDescription = "Autoriza el acceso protegido a tus documentos y operaciones."
