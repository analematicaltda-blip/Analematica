[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sgacd-wallet-ui"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["flet==0.28.3", "sgacd-wallet-offline==0.1.0"]
[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
web = ["flet-web==0.28.3", "fastapi==0.115.12", "starlette==0.46.2", "uvicorn==0.34.2"]
