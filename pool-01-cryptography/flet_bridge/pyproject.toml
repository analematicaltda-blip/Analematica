[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sgacd-vault"
version = "0.2.0"
description = "Metadata-only Flet bridge to the SGACD native encrypted document vault"
requires-python = ">=3.10"
dependencies = ["flet>=0.28.3,<0.29"]
[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
[tool.setuptools.package-data]
"flutter.sgacd_vault" = ["**/*"]
