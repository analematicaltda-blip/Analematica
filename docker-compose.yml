services:
  # 1. Base de Datos Relacional PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    container_name: sgacd_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgacd_db}
      POSTGRES_USER: ${POSTGRES_USER:-sgacd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgacd_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend RESTful FastAPI
  fastapi-backend:
    build:
      context: .
      dockerfile: BACKEND/SGA-CD-BACKEND/Dockerfile
    container_name: sgacd_backend
    init: true
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sgacd_user}:${POSTGRES_PASSWORD:-sgacd_password}@postgres:5432/${POSTGRES_DB:-sgacd_db}
      SECRET_KEY: ${SECRET_KEY:-sgacd_secret_key_change_in_production_2025}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      API_V1_STR: /api/v1
      PROJECT_NAME: "SGA-CD API Backend"
      OLLAMA_ENDPOINT: http://host.docker.internal:11434
      MEDIA_AI_URL: http://media-ai:8001
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Frontend Web Client (Nginx SPA)
  web-client:
    image: nginx:alpine
    container_name: sgacd_web
    restart: always
    depends_on:
      - fastapi-backend
    ports:
      - "8080:80"
    volumes:
      - ./FRONTEND/SGA-CD-WEB.git:/usr/share/nginx/html:ro

  # 4. Cliente Escritorio Flet
  flet-desktop-client:
    build:
      context: ./DESKTOP/SGA-CD-APP.git
      dockerfile: Dockerfile
    container_name: sgacd_flet_desktop
    restart: "no"
    depends_on:
      - fastapi-backend
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://fastapi-backend:8000}
      TENANT_API_KEY: ${TENANT_API_KEY:-sgacd_default_tenant_key}

  # 5. Cliente Movil Flet
  flet-mobile-client:
    build:
      context: ./MOVILES/SGA-CD-APK.git
      dockerfile: Dockerfile
    container_name: sgacd_flet_mobile
    restart: "no"
    depends_on:
      - fastapi-backend
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://fastapi-backend:8000}
      TENANT_API_KEY: ${TENANT_API_KEY:-sgacd_default_tenant_key}

  # 6. Nodo 6: Factoria Multimedia, IA y Video (FFmpeg Worker)
  media-ai:
    build:
      context: ./infra/media-ai
      dockerfile: Dockerfile
    container_name: sgacd_media_ai
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./FRONTEND/SGA-CD-WEB.git/assets/generated:/app/assets/generated
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_ENDPOINT: http://host.docker.internal:11434
      PORT: 8001

volumes:
  postgres_data:
    driver: local